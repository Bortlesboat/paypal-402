<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PayPal 402</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23003087'/%3E%3Ctext x='16' y='21' font-family='system-ui' font-size='12' font-weight='700' fill='white' text-anchor='middle'%3E402%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand"><span class="mark">402</span><span>PayPal 402</span></div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="agent" aria-selected="true">Agent</button>
      <button role="tab" data-tab="merchant" aria-selected="false">Merchant</button>
    </nav>
    <div class="pills"><span id="mode" class="pill"></span><span id="model" class="pill subtle"></span></div>
  </header>

  <main id="agent" class="view">
    <section class="col-main">
      <form id="task-form" class="card task">
        <label for="task" class="sr-only">Task</label>
        <textarea id="task" rows="3">What fee should I pay to get my Bitcoin tx confirmed within an hour? Also summarize the mempool.</textarea>
        <div class="task-row">
          <div class="presets">
            <button type="button" class="chip" data-preset="Next block or nothing: what fee rate do I need right now?">Next block</button>
            <button type="button" class="chip" data-preset="I'm not in a hurry. Cheapest fee to confirm within a day, and how congested is the mempool?">Within a day</button>
            <button type="button" class="chip" data-preset="I'll be checking fees all afternoon for a batch of payouts. Get the 30 minute fee and the mempool summary.">Batch payouts</button>
          </div>
          <button id="run" class="btn primary" type="submit">Run agent</button>
        </div>
      </form>
      <ol id="timeline" class="timeline" aria-live="polite"></ol>
    </section>

    <aside class="col-side">
      <section class="card">
        <div class="card-head"><h2>Wallet</h2><span id="link-state" class="muted small"></span></div>
        <div id="link-box"></div>
        <div class="budget">
          <div class="budget-num"><span id="budget-left">$0.00</span><span class="muted"> left today</span></div>
          <div class="meter"><span id="budget-bar"></span></div>
          <div class="muted small" id="budget-caption"></div>
        </div>
      </section>

      <section id="approvals-card" class="card hidden">
        <div class="card-head"><h2>Approvals</h2></div>
        <ul id="approvals" class="list"></ul>
      </section>

      <section class="card">
        <div class="card-head"><h2>Policy</h2></div>
        <form id="policy" class="policy">
          <label>Daily budget<span class="money"><i>$</i><input name="dailyBudget" inputmode="decimal"></span></label>
          <label>Max per call<span class="money"><i>$</i><input name="perCallCap" inputmode="decimal"></span></label>
          <label>Ask me above<span class="money"><i>$</i><input name="approvalAbove" inputmode="decimal"></span></label>
          <label class="wide">Allowed merchants<textarea name="allowedOrigins" rows="2"></textarea></label>
          <label class="toggle wide"><input type="checkbox" name="paused"> Pause all payments</label>
          <button class="btn wide" type="submit">Save</button>
        </form>
      </section>

      <section class="card">
        <div class="card-head"><h2>Receipts</h2></div>
        <ul id="ledger" class="list"></ul>
      </section>
    </aside>
  </main>

  <main id="merchant" class="view hidden">
    <section class="kpis">
      <div class="kpi"><span class="kpi-label">Revenue</span><span class="kpi-value" id="k-revenue">$0.00</span></div>
      <div class="kpi"><span class="kpi-label">PayPal captures</span><span class="kpi-value" id="k-captures">0</span></div>
      <div class="kpi"><span class="kpi-label">Calls served</span><span class="kpi-value" id="k-calls">0</span></div>
      <div class="kpi"><span class="kpi-label">Prepaid calls outstanding</span><span class="kpi-value" id="k-credits">0</span></div>
    </section>
    <section class="card">
      <div class="card-head"><h2>Endpoints</h2><span class="muted small" id="m-name"></span></div>
      <table class="table"><thead><tr><th>Route</th><th>Price</th><th class="num">Calls</th></tr></thead><tbody id="routes"></tbody></table>
    </section>
    <section class="card">
      <div class="card-head"><h2>Captures</h2></div>
      <div class="table-wrap"><table class="table"><thead><tr><th>Time</th><th>Order</th><th>Capture</th><th>Type</th><th>Route</th><th class="num">Amount</th></tr></thead><tbody id="payments"></tbody></table></div>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
